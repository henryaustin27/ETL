- stage: DeployToDEV
  displayName: Deploy to DEV
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev_02'))
  jobs:
  - deployment: DeployADFDev
    displayName: Deploy ADF to DEV
    environment: 'DEV'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download ARM templates
            inputs:
              artifact: 'ArmTemplates'
              path: '$(Pipeline.Workspace)/ArmTemplates'

          - script: |
              echo "Listing downloaded ARM template files"
              dir "$(Pipeline.Workspace)\ArmTemplates" /s
            displayName: 'List ARM artifact files'

          - task: AzurePowerShell@5
            displayName: Stop modified triggers
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'FilePath'
              ScriptPath: '$(Pipeline.Workspace)/ArmTemplates/PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $true
                -deleteDeployment $false
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Deploy ARM template
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'InlineScript'
              Inline: |
                New-AzResourceGroupDeployment `
                  -Name "ADF-DEV-$(Build.BuildId)" `
                  -ResourceGroupName "$(kvResourceGroupDev)" `
                  -TemplateFile "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json" `
                  -TemplateParameterFile "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateParametersForFactory.json" `
                  -factoryName "$(kvDataFactoryDev)" `
                  -Mode Incremental `
                  -Verbose
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Start modified triggers
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'FilePath'
              ScriptPath: '$(Pipeline.Workspace)/ArmTemplates/PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $false
                -deleteDeployment $false
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true
