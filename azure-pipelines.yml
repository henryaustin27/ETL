name: ADF_Deploy_$(date:yyyy)_$(date:MMdd)_$(rev:r)

trigger:
  branches:
    include:
      - dev_02

pool:
  vmImage: 'windows-latest'

variables:
  - group: Dev

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: |
        echo "Build.SourceBranch: $(Build.SourceBranch)"

    - task: CopyFiles@2
      displayName: 'Copy Files to Artifact Staging Directory'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'ADF Build'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: DeployToDEV
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev_02'))
  jobs:
  - job: DeployJob
    steps:
    - script: echo DeployToDEV

    - task: DownloadBuildArtifacts@1
      displayName: 'Download Build Artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: liprec.vsts-publish-adf.toggle-adf-trigger.toggle-adf-trigger@2
      displayName: 'Stop ADF Dev Triggers'
      inputs:
        azureSubscription: 'adf-devops-connection-dev'
        ResourceGroupName: '$(kvResourceGroupDev)'
        DatafactoryName: '$(kvDataFactoryDev)'
        TriggerStatus: 'stop'
        Continue: true

    - task: liprec.vsts-publish-adf.deploy-adf-json.deploy-adf-json@2
      displayName: 'Deploy JSON files to $(kvDataFactoryDev)'
      inputs:
        azureSubscription: 'adf-devops-connection-dev'
        ResourceGroupName: '$(kvResourceGroupDev)'
        DatafactoryName: '$(kvDataFactoryDev)'
        ServicePath: '$(System.ArtifactsDirectory)/drop/linkedService'
        DatasetPath: '$(System.ArtifactsDirectory)/drop/dataset'
        PipelinePath: '$(System.ArtifactsDirectory)/drop/pipeline'
        TriggerPath: '$(System.ArtifactsDirectory)/drop/trigger'
        DataflowPath: '$(System.ArtifactsDirectory)/drop/dataflow'
        Continue: true

    - task: liprec.vsts-publish-adf.toggle-adf-trigger.toggle-adf-trigger@2
      displayName: 'Start ADF Dev Triggers'
      inputs:
        azureSubscription: 'adf-devops-connection-dev'
        ResourceGroupName: '$(kvResourceGroupDev)'
        DatafactoryName: '$(kvDataFactoryDev)'
        TriggerStatus: 'start'
        Continue: true
