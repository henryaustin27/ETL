name: ADF_Deploy_$(Date:yyyy)_$(Date:MMdd)_$(Rev:r)

trigger:
  branches:
    include:
      - dev_02

pr: none

pool:
  vmImage: windows-latest

variables:
  - group: Dev

  - name: adfRootFolder
    value: '$(Build.Repository.LocalPath)'

  - name: packageJsonFolder
    value: '$(Build.Repository.LocalPath)'

  - name: armOutputFolder
    value: '$(Build.Repository.LocalPath)\ArmTemplate'

  - name: armArtifactName
    value: 'ArmTemplates'

  - name: sourceFactoryId
    value: '/subscriptions/$(kvSubscriptionIdDev)/resourceGroups/$(kvResourceGroupDev)/providers/Microsoft.DataFactory/factories/$(kvDataFactoryDev)'

stages:
- stage: Build
  displayName: Build ARM Templates
  jobs:
  - job: BuildADF
    displayName: Validate and Export ADF ARM
    steps:
    - checkout: self
      clean: true

    - task: UseNode@1
      displayName: Use Node.js 20
      inputs:
        version: '20.x'

    - task: Npm@1
      displayName: Install npm dependencies
      inputs:
        command: install
        workingDir: '$(packageJsonFolder)'
        verbose: true

    - task: Npm@1
      displayName: Validate and export ARM template
      inputs:
        command: custom
        workingDir: '$(packageJsonFolder)'
        customCommand: 'run build export "$(adfRootFolder)" "$(sourceFactoryId)" "ArmTemplate"'

    - script: |
        echo Listing ARM output files
        dir "$(armOutputFolder)" /s
      displayName: List generated ARM files

    - task: PublishPipelineArtifact@1
      displayName: Publish ARM artifact
      inputs:
        targetPath: '$(armOutputFolder)'
        artifact: '$(armArtifactName)'
        publishLocation: pipeline

- stage: Deploy_Dev
  displayName: Deploy to DEV
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev_02'))
  jobs:
  - deployment: DeployADFDev
    displayName: Deploy ADF to DEV
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download ARM artifact
            inputs:
              artifact: '$(armArtifactName)'
              path: '$(Pipeline.Workspace)\$(armArtifactName)'

          - script: |
              echo Listing downloaded ARM artifact files
              dir "$(Pipeline.Workspace)\$(armArtifactName)" /s
            displayName: List downloaded ARM files

          - task: AzurePowerShell@5
            displayName: Stop modified triggers
            inputs:
              azureSubscription: 'adf-devops-dev'
              ScriptType: FilePath
              ScriptPath: '$(Pipeline.Workspace)\$(armArtifactName)\PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $true
                -deleteDeployment $false
              azurePowerShellVersion: LatestVersion
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Deploy ARM template to DEV
            inputs:
              azureSubscription: 'adf-devops-dev'
              ScriptType: InlineScript
              Inline: |
                New-AzResourceGroupDeployment `
                  -Name "ADF-DEV-$(Build.BuildId)" `
                  -ResourceGroupName "$(kvResourceGroupDev)" `
                  -TemplateFile "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json" `
                  -TemplateParameterFile "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateParametersForFactory.json" `
                  -factoryName "$(kvDataFactoryDev)" `
                  -Mode Incremental `
                  -Verbose
              azurePowerShellVersion: LatestVersion
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Start modified triggers
            inputs:
              azureSubscription: 'adf-devops-dev'
              ScriptType: FilePath
              ScriptPath: '$(Pipeline.Workspace)\$(armArtifactName)\PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $false
                -deleteDeployment $false
              azurePowerShellVersion: LatestVersion
              pwsh: true

- stage: Deploy_Prod
  displayName: Deploy to PROD
  dependsOn: Deploy_Dev
  condition: succeeded()
  variables:
    - group: prod
  jobs:
  - deployment: DeployADFProd
    displayName: Deploy ADF to PROD
    environment: PROD
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download ARM artifact
            inputs:
              artifact: '$(armArtifactName)'
              path: '$(Pipeline.Workspace)\$(armArtifactName)'

          - script: |
              echo Listing downloaded ARM artifact files
              dir "$(Pipeline.Workspace)\$(armArtifactName)" /s
            displayName: List downloaded ARM files

          - task: AzurePowerShell@5
            displayName: Stop modified triggers
            inputs:
              azureSubscription: 'azure-devops-prod'
              ScriptType: FilePath
              ScriptPath: '$(Pipeline.Workspace)\$(armArtifactName)\PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupProd)"
                -DataFactoryName "$(kvDataFactoryProd)"
                -predeployment $true
                -deleteDeployment $false
              azurePowerShellVersion: LatestVersion
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Deploy ARM template to PROD
            inputs:
              azureSubscription: 'azure-devops-prod'
              ScriptType: InlineScript
              Inline: |
                New-AzResourceGroupDeployment `
                  -Name "ADF-PROD-$(Build.BuildId)" `
                  -ResourceGroupName "$(kvResourceGroupProd)" `
                  -TemplateFile "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json" `
                  -TemplateParameterFile "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateParametersForFactory.json" `
                  -factoryName "$(kvDataFactoryProd)" `
                  -Mode Incremental `
                  -Verbose
              azurePowerShellVersion: LatestVersion
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Start modified triggers
            inputs:
              azureSubscription: 'azure-devops-prod'
              ScriptType: FilePath
              ScriptPath: '$(Pipeline.Workspace)\$(armArtifactName)\PrePostDeploymentScript.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)\$(armArtifactName)\ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupProd)"
                -DataFactoryName "$(kvDataFactoryProd)"
                -predeployment $false
                -deleteDeployment $false
              azurePowerShellVersion: LatestVersion
              pwsh: true
