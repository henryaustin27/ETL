name: ADF_Deploy_$(Date:yyyy)_$(Date:MMdd)_$(Rev:r)

trigger:
  branches:
    include:
      - dev_02

pool:
  vmImage: 'windows-latest'

variables:
  - group: Dev

  # Change this only if your ADF Git root folder is not the repo root.
  # Example: '$(Build.Repository.LocalPath)/adf'
  - name: adfRootFolder
    value: '$(Build.Repository.LocalPath)'

  # package.json location for ADF utilities. Keep as repo root if package.json is in root.
  - name: packageJsonFolder
    value: '$(Build.Repository.LocalPath)'

  # Source factory used for validation/export
  - name: sourceFactoryId
    value: '/subscriptions/$(kvSubscriptionIdDev)/resourceGroups/$(kvResourceGroupDev)/providers/Microsoft.DataFactory/factories/$(kvDataFactoryDev)'

  # ARM output folder inside the repo during build
  - name: armOutputFolder
    value: '$(Build.Repository.LocalPath)/ArmTemplate'

stages:
- stage: Build
  displayName: Build ARM Templates
  jobs:
  - job: BuildADF
    displayName: Validate and Export ARM
    steps:
    - checkout: self
      clean: true

    - task: UseNode@1
      displayName: Install Node.js 20
      inputs:
        version: '20.x'

    - task: Npm@1
      displayName: Install npm packages
      inputs:
        command: 'install'
        workingDir: '$(packageJsonFolder)'
        verbose: true

    - task: Npm@1
      displayName: Validate and Generate ARM template
      inputs:
        command: 'custom'
        workingDir: '$(packageJsonFolder)'
        customCommand: 'run build export "$(adfRootFolder)" "$(sourceFactoryId)" "ArmTemplate"'

    - task: PublishPipelineArtifact@1
      displayName: Publish ARM templates
      inputs:
        targetPath: '$(armOutputFolder)'
        artifact: 'ArmTemplates'
        publishLocation: 'pipeline'

- stage: DeployToDEV
  displayName: Deploy to DEV
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev_02'))
  jobs:
  - deployment: DeployADFDev
    displayName: Deploy ADF to DEV
    environment: 'DEV'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download ARM templates
            inputs:
              artifact: 'ArmTemplates'
              path: '$(Pipeline.Workspace)/ArmTemplates'

          - task: AzurePowerShell@5
            displayName: Stop modified triggers
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'FilePath'
              ScriptPath: '$(Pipeline.Workspace)/ArmTemplates/PrePostDeploymentScript.Ver2.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $true
                -deleteDeployment $false
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Deploy ARM template
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'InlineScript'
              Inline: |
                New-AzResourceGroupDeployment `
                  -Name "ADF-DEV-$(Build.BuildId)" `
                  -ResourceGroupName "$(kvResourceGroupDev)" `
                  -TemplateFile "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json" `
                  -TemplateParameterFile "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateParametersForFactory.json" `
                  -factoryName "$(kvDataFactoryDev)" `
                  -Mode Incremental `
                  -Verbose
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true

          - task: AzurePowerShell@5
            displayName: Start modified triggers
            inputs:
              azureSubscription: 'adf-devops-connection-dev'
              ScriptType: 'FilePath'
              ScriptPath: '$(Pipeline.Workspace)/ArmTemplates/PrePostDeploymentScript.Ver2.ps1'
              ScriptArguments: >
                -armTemplate "$(Pipeline.Workspace)/ArmTemplates/ARMTemplateForFactory.json"
                -ResourceGroupName "$(kvResourceGroupDev)"
                -DataFactoryName "$(kvDataFactoryDev)"
                -predeployment $false
                -deleteDeployment $false
              azurePowerShellVersion: 'LatestVersion'
              pwsh: true
